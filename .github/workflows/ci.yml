name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Generated files, tests, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify generated files match their generators
        run: python3 scripts/check_generated.py

      - name: Run tests
        run: npm test

      - name: Package the extension
        run: python3 scripts/package_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: amber-material-release
          path: dist/*
          if-no-files-found: error
