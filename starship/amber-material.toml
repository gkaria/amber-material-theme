# Amber Material High Contrast — Starship prompt
# Generated by scripts/build_terminal_suite.py; edit the source palettes instead.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "amber_material"
format = "$os$username$hostname$directory$git_branch$git_status$package$nodejs$python$rust$golang$java$dotnet$docker_context$kubernetes$aws$azure$gcloud$line_break$character"
right_format = "$status$cmd_duration$time"

[palettes.amber_material]
background = "#1D2021"
foreground = "#E7E1D1"
surface = "#22252F"
surface_deep = "#1C1F27"
surface_raised = "#2A2E3A"
border = "#3A4052"
dim = "#888B84"
amber = "#FFCB6B"
amber_bright = "#FFE08A"
red = "#FF6B6B"
bright_red = "#FF8787"
green = "#B8D96D"
bright_green = "#D0EA8A"
blue = "#70B7FF"
bright_blue = "#94CAFF"
purple = "#D9A0FF"
bright_purple = "#E8BDFF"
cyan = "#66D9D0"
bright_cyan = "#8BE9E1"
white = "#FFFFFF"
selection = "#4A3F28"

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold amber"

[os.symbols]
Macos = " "
Windows = "󰍲 "
Linux = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Arch = " "

[username]
format = "[$user]($style)"
show_always = true
style_root = "bold red"
style_user = "dim"

[hostname]
format = "[@$hostname](bold blue) "
ssh_only = false

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"
style = "bold amber"
truncation_length = 4
truncate_to_repo = true

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold blue"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold amber_bright"

[package]
format = "via [$symbol$version]($style) "
symbol = "󰏗 "
style = "purple"

[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "green"

[python]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "amber_bright"

[rust]
format = "via [$symbol($version )]($style)"
symbol = "󱘗 "
style = "bright_red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bright_red"

[dotnet]
format = "via [$symbol($version )(🎯 $tfm )]($style)"
symbol = " "
style = "purple"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "blue"

[kubernetes]
disabled = false
format = 'on [$symbol$context( \($namespace\))]($style) '
symbol = "󱃾 "
style = "cyan"

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = " "
style = "amber"

[azure]
format = "on [$symbol($subscription)]($style) "
symbol = " "
style = "blue"

[gcloud]
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '
symbol = "󱇶 "
style = "bright_blue"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = " "
style = "bold red"

[cmd_duration]
format = "took [$duration]($style) "
min_time = 2_000
style = "dimmed dim"

[time]
disabled = false
format = "[$time]($style)"
style = "dimmed dim"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold amber)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold amber)"
