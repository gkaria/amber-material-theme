# Amber Material Light High Contrast — Grok Build pager
# Generated by scripts/build_grok_theme.py; edit the source palettes instead.
# Install to ~/.grok/pager.toml (see README).
#
# Grok's `[ui].theme` only accepts its five built-in themes, so the surrounding
# TUI keeps whichever of those is active. These are the appearance settings Grok
# does read from disk.

[scrollback.layout]
outer_vpad = 1
outer_hpad_left = 2
outer_hpad_right = 2
block_pad_left = 2
block_pad_right = 2

[scrollback.scrollbar]
enabled = true
gap_left = 0
gap_right = 0
scrollbar_bg = "#F0EBE0"
scrollbar_fg = "#E8E2D8"

[scrollback.display]
sticky_headers = true
expandable_indicator = true
# Amber Material runs high-contrast, so dimmed accents stay further from the
# background than Grok's 0.5 default to keep collapsed blocks legible.
dim_accent = 0.6

[animation]
fps = 30
wave_rows = 32

[scrollback.blocks.edit]
indent = true
hunk_separator = "…"
dual_line_numbers = false
bg = "light"

[scrollback.blocks.thinking]
accent_enabled = true
animate = true
truncated_lines = 3
bg_blend = 70
header = true
header_bright = false

[scrollback.blocks.tool]
muted_collapsed = true
dim_details = true
bullet = "diamond"

[scrollback.blocks.execute]
accent_enabled = true
header_style = "label"
muted_command_collapsed = true
first_lines = 2
last_lines = 3

[scrollback.blocks.prompt]
vpad = true
bg = "light"
show_prefix = true
min_lines = 2

[prompt]
collapse_unfocused = true
mouse_hover = true
show_prefix = true
